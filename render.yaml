# Render Blueprint — deploys the Flask quant-model site as a live web service.
# Create the service from this file: Render Dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: quant-model
    runtime: python
    # The backtest loads the rebalance panel into RAM (peaked ~0.8-1.2GB with the
    # old 2-month clock). The 512MB free/starter tiers will likely OOM — use a
    # >=2GB plan. Drop to "starter" only if you slim the data bundle first.
    #
    # MEASURED 2026-07-30: the shipped monthly panel is 141MB on the
    # deploy-trimmed artifact (1,814 names, 330 rebalances). An earlier comment
    # here guessed ~350MB by scaling from the research panel; that panel keeps
    # ~4,169 rows per rebalance because it uses real PIT membership, while the
    # deploy panel is capped at the top 1,000 by market cap.
    #
    # The 2Gi OOM on 2026-07-30 was NOT the panel's resident size. lru_cache
    # holds no lock across the wrapped call, so the boot warm-up thread and an
    # incoming request both missed and both BUILT the panel at once -- and a
    # build peaks far above the finished pickle because it holds every name's
    # price arrays at the same time. Fixed with a build lock in load_edge_panel.
    # If deploys start dying again, check the service events for oomKilled before
    # assuming a code fault.
    plan: standard
    buildCommand: "pip install -r requirements.txt && python fetch_data.py"
    # timeout 240: a real backtest is ~30-60s (cold panel build for a non-default
    # clock ~1-2min), so 4min is generous headroom while capping how long a wedged
    # request can hold a thread. 1 worker is deliberate — each worker holds its own
    # ~400MB of panels, so more workers would OOM the 2GB plan before adding throughput
    # (the work is CPU-bound anyway). Throughput comes from the caches, not concurrency.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 240"
    healthCheckPath: /api/meta
    # PERSISTENT DISK -- holds the paper-trading forward record.
    # Render's filesystem is ephemeral without this. The record is not in git
    # (it accrues on the host) and not in the data bundle (which is rebuilt from
    # research and would overwrite it), so before this disk every deploy silently
    # reset the only out-of-sample evidence the model has -- while the page kept
    # presenting it as a forward record. 1GB is far more than a JSON log needs;
    # it is the smallest size Render sells.
    # NOTE: a service with a disk cannot scale past one instance. Already true
    # here (workers 1, see startCommand), so this costs nothing.
    disk:
      name: tracker-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: EDGE_TRACKER_PATH
        value: /var/data/edge_tracker.json
      # Rebuilt panels land here too. The fingerprint hashes edge_lib.py, so any
      # code change invalidates the panel shipped in the bundle, and code deploys
      # independently of data. Between a code push and a bundle republish the
      # panel WILL be rebuilt; this makes that cost land once, on the first cold
      # start, rather than on every one.
      - key: EDGE_PANEL_CACHE_DIR
        value: /var/data
      # Cache for the per-holding company write-ups. On the persistent disk so a
      # restart does not re-fetch ten Yahoo business summaries. No API key is
      # involved: the descriptions are Yahoo text plus arithmetic on the model's
      # own numbers (see company_desc.py). Losing this file costs one slow sync,
      # never a wrong number.
      - key: EDGE_DESC_PATH
        value: /var/data/company_desc.json
      # Pin the universe rule. edge_lib defaults USE_PIT_UNIVERSE to whatever
      # pit_universe auto-detects, and now that the artifact reports
      # source=sharadar the SharadarAdapter activates -- so production would
      # silently run a DIFFERENT universe from the one every backtest was
      # validated against. The shipped model is the top-N-by-market-cap proxy.
      - key: EDGE_USE_PIT_UNIVERSE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Point this at the release TAG, not an individual asset:
      #   https://api.github.com/repos/<owner>/<repo>/releases/tags/data-v2-sharadar
      # fetch_data.py finds data_bundle.zip underneath it and versions off the
      # asset's own id+updated_at. Pinning an asset ID instead meant BOTH this
      # and DATA_VERSION had to be hand-edited on every republish -- and if you
      # forgot, the site quietly kept serving the previous bundle.
      # Publish with `python publish_bundle.py` (always uses the fixed name).
      - key: DATA_URL
        sync: false
      # Publishing to the PUBLIC Vision repo needs Contents:write there. Kept
      # separate from GITHUB_TOKEN on purpose: the deploy token only needs
      # Contents:READ on this private repo, and widening it would give the
      # data-fetch path write access it never needs. Optional -- without it the
      # "Sync to Vision" button reports the failure instead of pretending.
      - key: VISION_GITHUB_TOKEN
        sync: false
      - key: FISCAL_API_KEY    # optional — only needed if you rebuild data on the host
        sync: false
