# Render Blueprint — deploys the Flask quant-model site as a live web service.
# Create the service from this file: Render Dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: quant-model
    runtime: python
    # The backtest loads a ~179MB panel into RAM (peaks ~0.8-1.2GB). The 512MB
    # free/starter tiers will likely OOM — use a >=2GB plan. Drop to "starter"
    # only if you slim the data bundle first.
    plan: standard
    buildCommand: "pip install -r requirements.txt && python fetch_data.py"
    # timeout 240: a real backtest is ~30-60s (cold panel build for a non-default
    # clock ~1-2min), so 4min is generous headroom while capping how long a wedged
    # request can hold a thread. 1 worker is deliberate — each worker holds its own
    # ~400MB of panels, so more workers would OOM the 2GB plan before adding throughput
    # (the work is CPU-bound anyway). Throughput comes from the caches, not concurrency.
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 240"
    healthCheckPath: /api/meta
    # PERSISTENT DISK -- holds the paper-trading forward record.
    # Render's filesystem is ephemeral without this. The record is not in git
    # (it accrues on the host) and not in the data bundle (which is rebuilt from
    # research and would overwrite it), so before this disk every deploy silently
    # reset the only out-of-sample evidence the model has -- while the page kept
    # presenting it as a forward record. 1GB is far more than a JSON log needs;
    # it is the smallest size Render sells.
    # NOTE: a service with a disk cannot scale past one instance. Already true
    # here (workers 1, see startCommand), so this costs nothing.
    disk:
      name: tracker-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: EDGE_TRACKER_PATH
        value: /var/data/edge_tracker.json
      # Pin the universe rule. edge_lib defaults USE_PIT_UNIVERSE to whatever
      # pit_universe auto-detects, and now that the artifact reports
      # source=sharadar the SharadarAdapter activates -- so production would
      # silently run a DIFFERENT universe from the one every backtest was
      # validated against. The shipped model is the top-N-by-market-cap proxy.
      - key: EDGE_USE_PIT_UNIVERSE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATA_URL          # set in the dashboard: direct-download URL of data_bundle.zip
        sync: false
      - key: FISCAL_API_KEY    # optional — only needed if you rebuild data on the host
        sync: false
